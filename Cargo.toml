[package]
name         = "terminal-cell"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/terminal-cell"
description  = "Low-level durable terminal cell with transcript replay."
publish      = false

[lib]
name = "terminal_cell"
path = "src/lib.rs"

[dependencies]
crossterm    = "0.28"
kameo        = { version = "0.20", features = ["macros"] }
portable-pty = "0.8"
regex        = "1"
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-terminal = { git = "https://github.com/LiGoldragon/signal-terminal.git", branch = "main" }
signal-hook  = "0.3"
thiserror    = "2"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
vt100        = "0.16"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
