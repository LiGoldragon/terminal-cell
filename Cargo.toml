[package]
name         = "terminal-cell"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/terminal-cell"
description  = "Low-level durable terminal cell with transcript replay."
publish      = false

[lib]
name = "terminal_cell"
path = "src/lib.rs"

[dependencies]
crossterm    = "0.28"
kameo        = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", features = ["macros"] }
nota    = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main" }
portable-pty = "0.8"
regex        = "1"
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-terminal = { git = "https://github.com/LiGoldragon/signal-terminal.git", branch = "main" }
signal-hook  = "0.3"
thiserror    = "2"
tokio        = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
vt100        = "0.16"

[features]
default = []
nota-text = []

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
